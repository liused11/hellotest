<section class = "mt-10 mb-25">
    <div class="container mx-auto p-4 max-w-4xl">
        <h1 class="text-2xl font-bold mb-6">All Tasks</h1>
      
        <div class="bg-white shadow-md rounded-lg overflow-hidden">
          <!-- Task List -->
          <div *ngIf="pendingTodos.length > 0; else noTasks">
            <div *ngFor="let todo of pendingTodos" class="border-b border-gray-200 last:border-0">
              <div class="flex items-center p-4 hover:bg-yellow-50 bg-yellow-100" >
                    <span>{{ todo.task }}</span>
                </div>
              </div>
            </div>
          </div>
        </div>
    </section>

    <ng-template #noTasks>
      <div class="p-8 text-center text-gray-500">
        <p>No tasks found.</p>
      </div>
    </ng-template>
