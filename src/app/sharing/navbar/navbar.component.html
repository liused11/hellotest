<nav class="bg-blue-600 shadow-lg">
    <div class="max-w-6xl mx-auto px-4">
      <div class="flex justify-between">
        <div class="flex space-x-4"> 
          <!-- Logo -->
          <div>
            <a routerLink="" class="flex items-center py-5 px-2 text-white">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-1 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
              </svg>
              <span class="font-bold">TaskMaster</span>
            </a>
          </div>
          
          <!-- Primary Nav -->
          <div class="hidden md:flex items-center space-x-1">
            <a routerLink="/todolist" class="py-5 px-3 text-white hover:text-blue-200">All Tasks</a>
            <a routerLink="/todo-completed" class="py-5 px-3 text-white hover:text-blue-200">Completed</a>
            <a routerLink="/todo-pending" class="py-5 px-3 text-white hover:text-blue-200">Pending</a>
          </div>
        </div>
        
        <!-- Secondary Nav -->
        <div class="hidden md:flex items-center space-x-1">
          <button (click)="openNewTaskModal()" class="py-2 px-3 bg-blue-700 hover:bg-blue-800 text-white rounded-md transition duration-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline mr-1" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" />
            </svg>
            New Task
          </button>
        </div>
        
        <!-- Mobile menu button -->
        <div class="md:hidden flex items-center">
          <button class="mobile-menu-button focus:outline-none" (click)="toggleMenu()" aria-label="Toggle navigation menu">
            <svg class="w-6 h-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
        </div>
      </div>
    </div>
    
    <!-- Mobile menu -->
    <div class="mobile-menu md:hidden" [ngClass]="{'block': mobileMenuOpen, 'hidden': !mobileMenuOpen}">
      <a routerLink="/todolist" class="block py-2 px-4 text-sm hover:bg-blue-700 text-white">All Tasks</a>
      <a routerLink="/todo-completed" class="block py-2 px-4 text-sm hover:bg-blue-700 text-white">Completed</a>
      <a routerLink="/todo-pending" class="block py-2 px-4 text-sm hover:bg-blue-700 text-white">Pending</a>
      <button (click)="openNewTaskModal()" class="block py-2 px-4 text-sm hover:bg-blue-700 text-white w-full text-left">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline mr-1" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" />
        </svg>
        New Task
      </button>
    </div>
  </nav>
  
  <!-- Modal สำหรับเพิ่ม Task -->
  <div *ngIf="showNewTaskModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"> 
    <div class="bg-white p-6 rounded-lg shadow-lg w-80">
      <h2 class="text-xl font-bold mb-4 text-gray-800">Add New Task</h2>
      <input
        [(ngModel)]="newTaskName"
        type="text"
        placeholder="Task name"
        class="border border-gray-300 p-2 w-full rounded mb-4"
      />
      <div class="flex justify-end gap-2">
        <button (click)="closeNewTaskModal()" class="px-4 py-1 bg-gray-300 rounded hover:bg-gray-400">Cancel</button>
        <button (click)="addTask()" class="px-4 py-1 bg-blue-600 text-white rounded hover:bg-blue-700">Add</button>
      </div>
    </div>
  </div>
